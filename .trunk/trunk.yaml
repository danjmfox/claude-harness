# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - actionlint
    - checkov
    - pinact
    - taplo
  ignore:
    - linters: [markdownlint, prettier]
      paths:
        - claude/skills/**
        # Prose config docs — hand-formatted standing orders, not code.
        # claude/CLAUDE.md is write-denied and cannot be autoformatted here.
        - CLAUDE.md
        - claude/CLAUDE.md
        - claude/ENGINEERING-DEFAULTS.md
    - linters: [svgo]
      paths:
        - claude/skills/miro-storymap-extract/fixtures/**
    - linters: [ALL]
      paths:
        - .claude/task_plan.md
        - .claude/findings.md
        - .claude/progress.md
  enabled:
    - hadolint@2.15.1
    - svgo@4.1.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - git-diff-check
    - markdownlint@0.50.0
    - prettier@3.9.10
    - trufflehog@3.99.8
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-fmt-pre-commit
  enabled:
    - trunk-check-pre-push
    - trunk-upgrade-available
tools:
  enabled:
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - snyk@1.1295.0
