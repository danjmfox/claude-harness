name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install trunk
        run: |
          curl -fsSL https://get.trunk.io | bash -s -- -y --version 1.25.0
          echo "${HOME}/.trunk/bin" >>"${GITHUB_PATH}"
      - run: trunk check --all --no-progress --ci

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zsh and mise
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh
          curl -fsSL https://mise.run | sh
          echo "${HOME}/.local/share/mise/shims" >>"${GITHUB_PATH}"
          echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"

      # The suites assert on behaviour, not just completion. They are the reason
      # a stranger's clone can trust the absent-overlay path.
      - name: Test suites
        run: |
          failed=0
          for suite in tests/*-tests.sh; do
            printf '\n=== %s ===\n' "${suite}"
            bash "${suite}" || failed=1
          done
          exit "${failed}"

      - name: Install with no overlay present
        env:
          SHELL: /usr/bin/zsh
        run: ./install.sh

      - name: Verify target state
        run: bash scripts/doctor.sh --manifest config/target-state.docker.sh
